<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>body{margin:0;background:#061015;color:#f5f7f7;font:14px system-ui}.app{max-width:900px;margin:auto;padding-bottom:50px}header{padding:15px;background:#08171d;border-bottom:1px solid #29434d;position:sticky;top:0;z-index:2}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:#e1bf67;color:#111;font-weight:1000}.small,.muted{font-size:11px;color:#9db1b7;line-height:1.45}.card{margin:12px;padding:15px;border:1px solid #29434d;border-radius:17px;background:#0d1e25}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{padding:9px 12px;border-radius:999px;border:1px solid #29434d;background:#09161b;color:#dbe4e6;font-weight:800}.active{background:#e1bf67!important;color:#111!important}.stats,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.grid{grid-template-columns:1fr 1fr}.stat,.box{padding:10px;border:1px solid #29434d;border-radius:10px}.stat{text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:#9db1b7}.button{width:100%;padding:14px;border:0;border-radius:12px;background:#e1bf67;font-weight:1000}.score{font-size:44px;color:#79e3a0;font-weight:1000}.build{padding:14px;border:1px solid #3b5a63;border-radius:14px;background:#10262e}.row{padding:12px;border-bottom:1px solid #213840;display:flex;justify-content:space-between;cursor:pointer}.box li{font-size:10px;line-height:1.5}.ok,.warn{margin-top:10px;padding:10px;border-radius:8px;font-size:10px;line-height:1.45}.ok{border-left:3px solid #79e3a0;background:#0e2118}.warn{border-left:3px solid #e1bf67;background:#211b0c}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div class="brand"><div class="logo">BP</div><div><b>Throne and Liberty – Braze Power Builder</b><div class="small">Build Forge · Patch 4.3.0 · Datenbank-Engine</div></div></div></header><main><section class="card"><b>Datenbank</b><p class="muted">Kombiniert Questlog-Katalog, Item-/Rüstungsdaten, Artefaktfamilien und verifizierte Patchregeln. Unbekannte Werte werden nicht erfunden.</p><div id="stats" class="stats"></div></section><section class="card"><b>Simulation</b><div class="controls"><button class="pill active" data-mode="PvP">PvP</button><button class="pill" data-mode="PvE">PvE</button></div><div class="controls"><button class="pill active" data-goal="overall">Gesamt</button><button class="pill" data-goal="burst">Burst</button><button class="pill" data-goal="dps">DPS</button><button class="pill" data-goal="survive">Überleben</button><button class="pill" data-goal="support">Support</button></div><button class="button" id="run">Besten Build berechnen</button></section><section class="card"><h3>Top-Build</h3><div id="top">Lade Daten …</div></section><section class="card"><h3>Ranking</h3><div id="ranking"></div><div id="details"></div></section><section class="card"><h3>Datenvertrauen</h3><div id="rules" class="muted"></div></section></main></div><script>let D={},rules=[],mode='PvP',goal='overall';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],N=x=>typeof x==='number'&&isFinite(x)?x:0;const P=[['greatsword','spear','Bruiser / Engage'],['greatsword','daggers','Burst-Assassine'],['crossbow','daggers','Ranged Burst'],['longbow','wand','Ranged Support'],['staff','longbow','Ranged DPS'],['gauntlet','wand','Bruiser / Support'],['wand','staff','Burst Mage / Heiler'],['sword','greatsword','Front-Tank'],['staff','wand','Control / Support'],['spear','daggers','Mobile Bruiser']];const L={greatsword:'Großschwert',sword:'Schwert',daggers:'Dolche',crossbow:'Armbrust',longbow:'Langbogen',staff:'Stab',wand:'Zauberstab',spear:'Speer',gauntlet:'Panzerhandschuhe'};function val(x){let s=x.stats||{},v=N(s.strength)*2+N(s.dexterity)*2+N(s.wisdom)*2+N(s.perception)*2+N(s.maxHealth)/10+N(s.criticalHitChance)/10+N(s.heavyAttackChance)/10+N(s.hitChance)/10+N(s.cooldownSpeedPercent)+N(s.attackSpeed)+N(s.mainWeaponDamageMax)/4+N(s.offHandDamageMax)/4;return v+(x.traits||[]).length*3+(s.pvpHitChance?5:0)}function weapons(p){return D.items.filter(x=>x.category==='weapon'&&p.includes(x.weaponType)).sort((a,b)=>val(b)-val(a))}function rulesFor(p){return rules.filter(r=>r.weapon==='global'||p.includes(r.weapon))}function sim(c){let w=weapons(c),a=D.armor.filter(x=>x.verified),rr=rulesFor(c),base=w.reduce((n,x)=>n+val(x),0)+a.reduce((n,x)=>n+val(x)/4,0);let artifactBonus=D.artifacts.length*.02;let burst=base*.62*(1+artifactBonus),dps=base*.74*(1+artifactBonus),survive=base*.45,support=base*.35;for(const r of rr){if(r.damageMultiplier){burst*=r.damageMultiplier;dps*=r.damageMultiplier}if(r.monsterDamageMultiplier&&mode==='PvE')dps*=r.monsterDamageMultiplier;if(r.bossHeavyAttackChanceFlat)burst*=1.02;if(r.bossCriticalHitChanceFlat)burst*=1.02;if(r.hpRecoveryMultiplier)support*=r.hpRecoveryMultiplier;if(r.changedStat==='PvP Hit Chance'&&mode==='PvP')dps*=1.03;if(r.mainWeaponDamage)burst+=r.mainWeaponDamage[1]/3;if(r.extra?.electrocutionFiveStackDetonationMultiplier)burst*=1.03}if(c[2].includes('Burst'))burst*=1.16;if(c[2].includes('DPS'))dps*=1.12;if(/Tank|Support/.test(c[2]))survive*=1.12;if(c[2].includes('Support'))support*=1.25;let score=goal==='burst'?burst:goal==='dps'?dps:goal==='survive'?survive:goal==='support'?support:(burst+dps+survive+support)/4;return{c,w,a,rr,burst,dps,survive,support,score}}function detail(x){$('#details').innerHTML='<div class="build"><h3>'+x.c.slice(0,2).map(t=>L[t]).join(' + ')+'</h3><div class="grid"><div class="box"><b>Waffen</b><ul>'+x.w.map(w=>'<li>'+w.name+(w.verified?' ✓':'')+'</li>').join('')+'</ul></div><div class="box"><b>Rüstung</b><ul>'+x.a.slice(0,8).map(a=>'<li>'+a.name+' · '+a.slot+'</li>').join('')+'</ul></div><div class="box"><b>Artefaktfamilien</b><ul>'+D.artifacts.slice(0,8).map(a=>'<li>'+a.name+(a.verified?' ✓':' · Kandidat')+'</li>').join('')+'</ul></div><div class="box"><b>Simulation</b><ul><li>Burst: '+x.burst.toFixed(1)+'</li><li>DPS: '+x.dps.toFixed(1)+'</li><li>Überleben: '+x.survive.toFixed(1)+'</li><li>Support: '+x.support.toFixed(1)+'</li></ul></div></div><div class="ok">'+x.rr.length+' verifizierte Patch-Regeln berücksichtigt. Score ist ein Modellwert und kein offizieller Ingame-DPS-Wert.</div></div>')}function render(){let r=P.map(sim).sort((a,b)=>b.score-a.score),t=r[0];$('#top').innerHTML='<div class="build"><div class="score">'+t.score.toFixed(1)+'</div><b>#1 · '+mode+' · '+goal+'</b><h2>'+t.c.slice(0,2).map(x=>L[x]).join(' + ')+'</h2><p>'+t.c[2]+'</p><div class="grid"><div class="box"><b>Burst</b><br>'+t.burst.toFixed(1)+'</div><div class="box"><b>DPS</b><br>'+t.dps.toFixed(1)+'</div><div class="box"><b>Überleben</b><br>'+t.survive.toFixed(1)+'</div><div class="box"><b>Support</b><br>'+t.support.toFixed(1)+'</div></div></div>';$('#ranking').innerHTML=r.map((x,i)=>'<div class="row" data-i="'+i+'"><span><b>#'+(i+1)+' '+x.c.slice(0,2).map(y=>L[y]).join(' + ')+'</b><br><span class="small">'+x.c[2]+' · '+x.rr.length+' Regeln</span></span><b>'+x.score.toFixed(1)+'</b></div>').join('');$$('.row').forEach(e=>e.onclick=()=>detail(r[+e.dataset.i]));$('#rules').innerHTML='✓ '+rules.filter(x=>x.verified).length+' verifizierte Patchregeln · '+D.artifacts.length+' Artefaktfamilien · '+D.armor.length+' Rüstungseinträge. Artefaktfamilien ohne verifizierte Stone-Effekte bleiben Kandidaten.'}async function load(){let [q,i,a,r]=await Promise.all(['data/questlog_catalog.json','data/items.json','data/armor_artifacts.json','data/combat_rules_4_3_0.json'].map(x=>fetch(x,{cache:'no-store'}).then(z=>z.json())));D.items=[...(q.observedItems||[]),...(i.items||[]).map(x=>({...x,category:x.type}))];D.armor=a.armor||[];D.artifacts=a.artifactFamilies||[];rules=r.rules||[];$('#stats').innerHTML='<div class="stat"><b>'+D.items.length+'</b><span>Items</span></div><div class="stat"><b>'+D.armor.length+'</b><span>Rüstung</span></div><div class="stat"><b>'+D.artifacts.length+'</b><span>Artefaktfamilien</span></div><div class="stat"><b>'+rules.filter(x=>x.verified).length+'</b><span>verifizierte Regeln</span></div>';render()}$$('[data-mode]').forEach(b=>b.onclick=()=>{$$('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;render()});$$('[data-goal]').forEach(b=>b.onclick=()=>{$$('[data-goal]').forEach(x=>x.classList.remove('active'));b.classList.add('active');goal=b.dataset.goal;render()});$('#run').onclick=render;load().catch(e=>$('#top').innerHTML='<div class="warn">Datenbankfehler: '+e.message+'</div>');</script></body></html>
