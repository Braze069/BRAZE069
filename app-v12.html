<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v11.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#skills'))return setTimeout(boot,100);if(d.getElementById('skillEditorV12'))return;const sec=d.createElement('section');sec.id='skillEditorV12';sec.className='card';sec.innerHTML='<h3>Skill-Auswahl</h3><p class="muted">Wähle die Skills für die beiden Waffen. Der Score verwendet nur numerische Skill-Effekte, die im verifizierten Regelsatz ausdrücklich hinterlegt sind. Fehlt ein belegter Effekt, wird kein Wert erfunden.</p><div id="skillChoices"></div><div id="skillInfo" class="muted" style="margin-top:9px"></div>';const skillsCard=d.querySelector('#skills').closest('.card');skillsCard.parentNode.insertBefore(sec,skillsCard.nextSibling);const choices=sec.querySelector('#skillChoices'),info=sec.querySelector('#skillInfo');function getList(type){return (w.D&&w.D.skillFamilies&&w.D.skillFamilies[type])||[]}function render(){const a=w.active;if(!a)return;const aList=getList(a.c[0]),bList=getList(a.c[1]);let sel=a.skillSelection||[aList[0]||'',bList[0]||''];choices.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box"><b>'+((w.L&&w.L[a.c[0]])||a.c[0])+' Skill</b><select id="skA" class="select" style="width:100%;margin-top:7px">'+aList.map(x=>'<option '+(x===sel[0]?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="box"><b>'+((w.L&&w.L[a.c[1]])||a.c[1])+' Skill</b><select id="skB" class="select" style="width:100%;margin-top:7px">'+bList.map(x=>'<option '+(x===sel[1]?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div>';d.getElementById('skA').onchange=()=>{a.skillSelection=[d.getElementById('skA').value,d.getElementById('skB').value];info.textContent='Skill geändert. Drücke „Charakter-Score neu berechnen“, um belegte Skill-Effekte erneut auszuwerten.'};d.getElementById('skB').onchange=()=>{a.skillSelection=[d.getElementById('skA').value,d.getElementById('skB').value];info.textContent='Skill geändert. Drücke „Charakter-Score neu berechnen“, um belegte Skill-Effekte erneut auszuwerten.'};}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active)return;const b=w.sim(w.active.c,w.active.l);b.skillSelection=w.active.skillSelection||[];let matched=0;if(Array.isArray(w.rules)){for(const r of w.rules){const names=Array.isArray(r.skills)?r.skills:(r.skillName?[r.skillName]:[]);if(names.some(n=>b.skillSelection.includes(n))){matched++;if(typeof r.damageMultiplier==='number'){b.burst*=r.damageMultiplier;b.dps*=r.damageMultiplier}if(typeof r.monsterDamageMultiplier==='number'&&w.mode==='PvE')b.dps*=r.monsterDamageMultiplier}}}b.score=w.goal==='burst'?b.burst:w.goal==='dps'?b.dps:w.goal==='survive'?b.survive:w.goal==='support'?b.support:(b.burst+b.dps+b.survive+b.support)/4;w.active=b;w.renderAll(b);render();info.textContent=matched+' verifizierte Skill-Regel(n) wurden angewendet. '+(matched?'':'Für die Auswahl ist aktuell kein numerischer Skill-Effekt verifiziert; deshalb wurde der Score nicht künstlich verändert.');};const oldRenderAll=w.renderAll;w.renderAll=function(b){oldRenderAll(b);setTimeout(render,0)};render();}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
