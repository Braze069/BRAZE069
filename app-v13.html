<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v12.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#skills'))return setTimeout(boot,100);if(d.getElementById('skillSlotsV13'))return;const sec=d.createElement('section');sec.id='skillSlotsV13';sec.className='card';sec.innerHTML='<h3>Skill-Slots</h3><p class="muted">Bis zu vier auswählbare Skills je Waffe. Nur ausdrücklich verifizierte numerische Effekte verändern den Charakter-Score.</p><div id="skillSlotsGrid"></div><div id="skillSlotInfo" class="muted" style="margin-top:9px"></div>';const old=d.getElementById('skillEditorV12');(old||d.querySelector('#skills').closest('.card')).parentNode.insertBefore(sec,(old||d.querySelector('#skills').closest('.card')).nextSibling);const grid=sec.querySelector('#skillSlotsGrid'),info=sec.querySelector('#skillSlotInfo');function list(t){return (w.D&&w.D.skillFamilies&&w.D.skillFamilies[t])||[]}function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function render(){const b=w.active;if(!b)return;const types=[b.c[0],b.c[1]];b.skillSlots=b.skillSlots||[[],[]];let html='';types.forEach((t,wi)=>{const a=list(t),sel=b.skillSlots[wi]||[];html+='<div class="box" style="margin-top:8px"><b>'+((w.L&&w.L[t])||t)+' – Skills</b>';for(let i=0;i<4;i++){const cur=sel[i]||a[i]||'';html+='<div style="margin-top:7px"><span class="small">Skill '+(i+1)+'</span><select data-w="'+wi+'" data-s="'+i+'" style="width:100%;margin-top:4px;background:#08151a;color:#e9eeee;border:1px solid #29434d;border-radius:9px;padding:9px">'+a.map(x=>'<option value="'+esc(x)+'" '+(x===cur?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}html+='</div>'});grid.innerHTML=html;d.querySelectorAll('#skillSlotsV13 select').forEach(s=>s.onchange=()=>{const wi=+s.dataset.w,si=+s.dataset.s;b.skillSlots=b.skillSlots||[[],[]];b.skillSlots[wi]=b.skillSlots[wi]||[];b.skillSlots[wi][si]=s.value;info.textContent='Skill geändert. Drücke „Charakter-Score neu berechnen“. ';});}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active)return;let b=w.sim(w.active.c,w.active.l);b.skillSlots=w.active.skillSlots||[[],[]];const selected=[...(b.skillSlots[0]||[]),...(b.skillSlots[1]||[])].filter(Boolean);let matched=0;if(Array.isArray(w.rules)){for(const r of w.rules){const names=Array.isArray(r.skills)?r.skills:(r.skillName?[r.skillName]:[]);if(names.some(n=>selected.includes(n))){matched++;if(typeof r.damageMultiplier==='number'){b.burst*=r.damageMultiplier;b.dps*=r.damageMultiplier}if(typeof r.monsterDamageMultiplier==='number'&&w.mode==='PvE')b.dps*=r.monsterDamageMultiplier;if(typeof r.hpRecoveryMultiplier==='number')b.support*=r.hpRecoveryMultiplier;if(typeof r.mainWeaponDamage?.[1]==='number')b.burst+=r.mainWeaponDamage[1]/3}}}b.score=w.goal==='burst'?b.burst:w.goal==='dps'?b.dps:w.goal==='survive'?b.survive:w.goal==='support'?b.support:(b.burst+b.dps+b.survive+b.support)/4;b.skillSlots=w.active.skillSlots;w.active=b;w.renderAll(b);render();info.innerHTML='<span class="badge">'+matched+' verifizierte Skill-Regeln angewendet</span> '+(matched?'':'Keine numerischen Skill-Effekte für die Auswahl verifiziert — Score nicht künstlich verändert.');};const oldRenderAll=w.renderAll;w.renderAll=function(b){oldRenderAll(b);setTimeout(render,0)};render();}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
