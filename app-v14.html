<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v13.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#extras'))return setTimeout(boot,100);if(d.getElementById('relicRuneV14'))return;const sec=d.createElement('section');sec.id='relicRuneV14';sec.className='card';sec.innerHTML='<h3>Artefakte & Runen – Auswahl</h3><p class="muted">Einzelne Familien auswählen. Nur verifizierte numerische Effekte verändern den Score; unbekannte Werte bleiben neutral.</p><div id="relicGrid"></div><div id="relicInfo" class="muted" style="margin-top:9px"></div>';const anchor=d.getElementById('extras').closest('.card');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const grid=sec.querySelector('#relicGrid'),info=sec.querySelector('#relicInfo');const opts=a=>a.length?a.map((x,i)=>'<option value="'+i+'">'+String(x.name||x).replace(/</g,'&lt;')+(x.verified?' ✓':'')+'</option>').join(''):'<option>Keine Daten</option>';function render(){const b=w.active;if(!b)return;const arts=w.D.artifacts||[],runes=w.D.runes||[];b.relics=b.relics||{artifact:0,rune:0};grid.innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box"><b>Artefaktfamilie</b><select id="artifactV14" style="width:100%;margin-top:7px;background:#08151a;color:#e9eeee;border:1px solid #29434d;border-radius:9px;padding:9px">'+opts(arts)+'</select><div class="small" style="margin-top:5px">'+(arts[b.relics.artifact]?.name||'—')+'</div></div><div class="box"><b>Runenfamilie</b><select id="runeV14" style="width:100%;margin-top:7px;background:#08151a;color:#e9eeee;border:1px solid #29434d;border-radius:9px;padding:9px">'+opts(runes)+'</select><div class="small" style="margin-top:5px">'+(runes[b.relics.rune]?.name||'—')+'</div></div></div>';d.getElementById('artifactV14').value=String(b.relics.artifact||0);d.getElementById('runeV14').value=String(b.relics.rune||0);d.getElementById('artifactV14').onchange=()=>{b.relics.artifact=+d.getElementById('artifactV14').value;info.textContent='Artefakt geändert. Score neu berechnen.';render()};d.getElementById('runeV14').onchange=()=>{b.relics.rune=+d.getElementById('runeV14').value;info.textContent='Rune geändert. Score neu berechnen.';render()}}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active)return;let b=w.sim(w.active.c,w.active.l);b.skillSlots=w.active.skillSlots||[[],[]];b.relics=w.active.relics||{artifact:0,rune:0};const arts=w.D.artifacts||[],runes=w.D.runes||[];let matched=0;const apply=x=>{if(!x)return;if(typeof x.damageMultiplier==='number'){b.burst*=x.damageMultiplier;b.dps*=x.damageMultiplier;matched++}if(typeof x.hpRecoveryMultiplier==='number'){b.support*=x.hpRecoveryMultiplier;matched++}if(typeof x.monsterDamageMultiplier==='number'&&w.mode==='PvE'){b.dps*=x.monsterDamageMultiplier;matched++}};const chosen=[arts[b.relics.artifact],runes[b.relics.rune]];for(const x of chosen)apply(x);const selected=[...(b.skillSlots[0]||[]),...(b.skillSlots[1]||[])].filter(Boolean);if(Array.isArray(w.rules))for(const r of w.rules){const names=Array.isArray(r.skills)?r.skills:(r.skillName?[r.skillName]:[]);if(names.some(n=>selected.includes(n))){if(typeof r.damageMultiplier==='number'){b.burst*=r.damageMultiplier;b.dps*=r.damageMultiplier;matched++}if(typeof r.monsterDamageMultiplier==='number'&&w.mode==='PvE'){b.dps*=r.monsterDamageMultiplier;matched++}}}b.score=w.goal==='burst'?b.burst:w.goal==='dps'?b.dps:w.goal==='survive'?b.survive:w.goal==='support'?b.support:(b.burst+b.dps+b.survive+b.support)/4;w.active=b;w.renderAll(b);render();info.innerHTML='<span class="badge">'+matched+' verifizierte Effekte angewendet</span> '+(matched?'':'Keine numerischen Effekte für die Auswahl verifiziert — Score nicht künstlich verändert.');};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};render()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
