<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v14.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#editor'))return setTimeout(boot,100);if(d.getElementById('setSynergyV15'))return;const sec=d.createElement('section');sec.id='setSynergyV15';sec.className='card';sec.innerHTML='<h3>Set-Synergien</h3><p class="muted">Der Editor prüft Set-Zuordnungen und zählt aktive Teile. Ein Bonus wird nur berechnet, wenn der konkrete Bonus numerisch verifiziert in den Daten hinterlegt ist.</p><div id="setListV15"></div>';const anchor=d.getElementById('editor').closest('.card');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const out=sec.querySelector('#setListV15');function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function getSet(x){return x&&x.setId?x.setId:(x&&x.setName?x.setName:null)}function calculate(){const b=w.active;if(!b)return{counts:{},matched:[]};const counts={};Object.values(b.l||{}).filter(Boolean).forEach(x=>{const s=getSet(x);if(s)counts[s]=(counts[s]||0)+1});const bonuses=(w.D&&w.D.setBonuses)||[];const matched=[];for(const s of bonuses){const id=s.setId||s.id||s.name;if(counts[id]&&Array.isArray(s.bonuses))for(const bn of s.bonuses)if(counts[id]>=(bn.pieces||0)&&bn.verified===true)matched.push({...bn,setId:id})}return{counts,matched}}function render(){const z=calculate(),keys=Object.keys(z.counts);let html='';if(!keys.length)html='<div class="muted">In den aktuell ausgewählten Gegenständen sind noch keine verifizierten Set-Zuordnungen hinterlegt.</div>';else keys.forEach(k=>html+='<div class="box" style="margin-top:7px"><b>'+esc(k)+'</b><br><span class="small">'+z.counts[k]+' Teil(e) angelegt</span></div>');if(z.matched.length)html+='<div style="margin-top:9px"><b>Aktive verifizierte Boni</b>'+z.matched.map(x=>'<div class="box" style="margin-top:6px"><span class="badge">'+x.pieces+'-TEIL-BONUS</span> '+esc(x.description||x.name)+'</div>').join('')+'</div>';else html+='<div class="warn">Noch kein numerischer Setbonus wird automatisch angewendet. Dadurch wird der Charakter-Score nicht künstlich erhöht.</div>';out.innerHTML=html}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active)return;oldRecalc();const z=calculate();let bonus=1,support=1;for(const x of z.matched){if(typeof x.damageMultiplier==='number')bonus*=x.damageMultiplier;if(typeof x.monsterDamageMultiplier==='number'&&w.mode==='PvE')bonus*=x.monsterDamageMultiplier;if(typeof x.hpRecoveryMultiplier==='number')support*=x.hpRecoveryMultiplier}w.active.burst*=bonus;w.active.dps*=bonus;w.active.support*=support;w.active.score=w.goal==='burst'?w.active.burst:w.goal==='dps'?w.active.dps:w.goal==='survive'?w.active.survive:w.goal==='support'?w.active.support:(w.active.burst+w.active.dps+w.active.survive+w.active.support)/4;w.renderAll(w.active);render()};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};render()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
