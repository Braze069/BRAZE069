<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v15.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');async function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#editor'))return setTimeout(boot,150);if(d.getElementById('verifiedSetDataV16'))return;try{const data=await fetch('data/set_bonuses.json',{cache:'no-store'}).then(r=>r.json());w.D.setBonuses=data.sets.flatMap(s=>s.bonuses.map(b=>({...b,setId:s.setId,name:s.name,verified:b.verified,items:s.items})));const badge=d.createElement('div');badge.id='verifiedSetDataV16';badge.className='small';badge.style.cssText='padding:8px 12px;text-align:center;color:#79e3a0';badge.textContent='✓ Verifizierte Set-Boni geladen: '+data.sets.length+' Sets';d.body.insertBefore(badge,d.body.firstChild);if(w.active&&typeof w.renderAll==='function')w.renderAll(w.active)}catch(e){console.warn('Set-Daten konnten nicht geladen werden',e)}}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
