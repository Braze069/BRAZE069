<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v16.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#editor'))return setTimeout(boot,100);if(d.getElementById('verifiedSetsV17'))return;const sec=d.createElement('section');sec.id='verifiedSetsV17';sec.className='card';sec.innerHTML='<h3>Verifizierte Set-Synergien</h3><p class="muted">Item-Set-Zuordnung und Boni aus verifizierten QuestLog-Daten. Konditionale Procs werden nicht als dauerhafter Score-Bonus missbraucht.</p><div id="verifiedSetList"></div>';const anchor=d.getElementById('extras')?.closest('.card')||d.getElementById('editor').closest('.card');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const out=sec.querySelector('#verifiedSetList');let db=null;fetch('data/set_synergy_verified_4_3_0.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{db=x;render();}).catch(()=>{out.innerHTML='<div class="warn">Set-Daten konnten nicht geladen werden.</div>'});function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function applyMappings(){if(!db||!w.D)return;const maps=db.itemSetMappings||[];const all=[...(w.D.armor||[]),...(w.D.accessories||[]),...(w.D.items||[])];for(const x of all){if(!x.setId){const m=maps.find(m=>String(x.name||'').toLowerCase().includes(m.match.toLowerCase()));if(m)x.setId=m.setId;}}}function calc(){applyMappings();const b=w.active;if(!b||!db)return {counts:{},active:[]};const counts={};for(const x of Object.values(b.l||{}).filter(Boolean)){if(x.setId)counts[x.setId]=(counts[x.setId]||0)+1}const active=[];for(const s of db.sets){for(const bn of s.bonuses||[]){if(counts[s.setId]>=bn.pieces&&bn.verified)active.push({...bn,setId:s.setId,setName:s.name})}}return{counts,active}}function render(){if(!db)return;const {counts,active}=calc();let h='';for(const s of db.sets){const n=counts[s.setId]||0;h+='<div class="box" style="margin-top:7px"><b>'+esc(s.name)+'</b><br><span class="small">'+n+' Teil(e) angelegt</span>';const a=active.filter(x=>x.setId===s.setId);if(a.length)h+='<div style="margin-top:6px">'+a.map(x=>'<span class="badge">'+x.pieces+'-TEIL-AKTIV</span> '+esc(x.description)).join('<br>')+'</div>';h+='</div>'}out.innerHTML=h}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active){return}oldRecalc();const {active}=calc();let mult=1;for(const x of active){const e=x.effects||{};if(typeof e.meleeDamageBoostPercent==='number'&&['sword','greatsword','daggers','spear','gauntlet'].includes(w.active.c[0]))mult*=1+e.meleeDamageBoostPercent/100;if(typeof e.skillCooldownSpeedPercent==='number')mult*=1+e.skillCooldownSpeedPercent/1000}w.active.burst*=mult;w.active.dps*=mult;w.active.score=w.goal==='burst'?w.active.burst:w.goal==='dps'?w.active.dps:w.goal==='survive'?w.active.survive:w.goal==='support'?w.active.support:(w.active.burst+w.active.dps+w.active.survive+w.active.support)/4;w.renderAll(w.active);render()};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};render()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
