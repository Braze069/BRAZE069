<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#f{width:100%;height:100vh;border:0}</style></head><body><iframe id="f" src="app-v17.html" title="Braze Power Builder"></iframe><script>(()=>{const f=document.getElementById('f');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#editor'))return setTimeout(boot,100);if(d.getElementById('traitV18'))return;const s=d.createElement('section');s.id='traitV18';s.className='card';s.innerHTML='<h3>Traits & Synergien</h3><p class="muted">Trait-Auswahl und Synergieanzeige. Verifizierte Kategorien stammen aus Questlog; nur vorhandene numerische Itemwerte beeinflussen den Score.</p><div id="traitListV18"></div><div id="traitInfoV18" class="muted" style="margin-top:9px"></div>';const anchor=d.getElementById('editor').closest('.card');anchor.parentNode.insertBefore(s,anchor.nextSibling);const out=s.querySelector('#traitListV18'),info=s.querySelector('#traitInfoV18');const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function itemTraits(x){if(!x)return[];let t=x.traits||x.traitOptions||[];if(!Array.isArray(t))return[];return t.map(v=>typeof v==='string'?{name:v}:v).filter(v=>v&&v.name)}function render(){const b=w.active;if(!b)return;const rows=[];Object.entries(b.l||{}).forEach(([slot,x])=>{itemTraits(x).forEach(t=>rows.push({slot,name:t.name,value:t.value??t.amount??t.max??null}))});out.innerHTML=rows.length?rows.map(t=>'<div class="box" style="margin-top:6px"><b>'+esc(t.slot)+'</b> · '+esc(t.name)+(t.value!=null?' <span class="badge">'+esc(t.value)+'</span>':'')+'</div>').join(''):'<div class="warn">Für die aktuell angelegten Items sind noch keine konkreten Trait-Werte in der lokalen Datenbank hinterlegt. Deshalb wird nichts geschätzt.</div>';info.textContent=rows.length?rows.length+' Trait-Einträge erkannt.':'Keine numerisch verifizierten Trait-Werte erkannt.'}const old=w.recalc;w.recalc=function(){if(!w.active)return;old();const b=w.active;let traitScore=0,count=0;Object.values(b.l||{}).filter(Boolean).forEach(x=>itemTraits(x).forEach(t=>{const v=Number(t.value??t.amount??t.max);if(!Number.isFinite(v))return;count++;const n=t.name.toLowerCase();if(n.includes('heavy attack')||n.includes('critical'))traitScore+=v*.10;else if(n.includes('skill damage boost'))traitScore+=v*.08;else if(n.includes('cooldown')||n.includes('attack speed'))traitScore+=v*.06;else if(n.includes('max health')||n.includes('endurance')||n.includes('evasion')||n.includes('resistance'))traitScore+=v*.03;else if(n.includes('buff duration')||n.includes('debuff duration'))traitScore+=v*.02;else traitScore+=v*.01});if(count){b.burst+=traitScore;b.dps+=traitScore;b.survive+=traitScore*.35;b.support+=traitScore*.2;b.score=w.goal==='burst'?b.burst:w.goal==='dps'?b.dps:w.goal==='survive'?b.survive:w.goal==='support'?b.support:(b.burst+b.dps+b.survive+b.support)/4;info.innerHTML='<span class="badge">'+count+' numerische Trait-Werte angewendet</span> Synergie neu berechnet.'}else info.textContent='Keine numerischen Trait-Werte vorhanden — Score bleibt unverändert.';w.renderAll(b);render()};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};render()}f.addEventListener('load',boot);})();</script></body></html>
