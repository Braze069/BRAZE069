<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v18.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#extras'))return setTimeout(boot,100);if(d.getElementById('runeEditorV19'))return;const sec=d.createElement('section');sec.id='runeEditorV19';sec.className='card';sec.innerHTML='<h3>Runen – Einzelne Auswahl & Synergie</h3><p class="muted">Verifizierte Rune-Effekte werden beim Score berücksichtigt. Nicht verifizierte Profile bleiben neutral.</p><div id="runeGridV19"></div><div id="runeInfoV19" class="muted" style="margin-top:9px"></div>';const anchor=d.getElementById('extras').closest('.card');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const grid=sec.querySelector('#runeGridV19'),info=sec.querySelector('#runeInfoV19');let db=[];function render(){const b=w.active;if(!b)return;const selected=(b.runeSlots||[0,0,0]);grid.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+selected.map((x,i)=>'<div class="box"><b>Rune-Slot '+(i+1)+'</b><select id="rv19_'+i+'" style="width:100%;margin-top:7px;background:#08151a;color:#e9eeee;border:1px solid #29434d;border-radius:9px;padding:9px">'+db.map((r,j)=>'<option value="'+j+'">'+r.name+(r.verified?' ✓':'')+'</option>').join('')+'</select></div>').join('')+'</div>';selected.forEach((x,i)=>{const el=d.getElementById('rv19_'+i);if(el){el.value=String(x||0);el.onchange=()=>{b.runeSlots=b.runeSlots||[0,0,0];b.runeSlots[i]=+el.value;info.textContent='Rune-Slot '+(i+1)+' geändert. Score neu berechnen.';render()}}})}async function load(){try{db=(await fetch('data/rune_effects_verified.json',{cache:'no-store'})).entries||[]}catch(e){db=[]}render()}const oldRecalc=w.recalc;w.recalc=function(){if(!w.active)return;oldRecalc();const b=w.active,slots=b.runeSlots||[0,0,0],chosen=slots.map(i=>db[i]).filter(x=>x&&x.verified);let hit=0,attack=1,dps=1,support=1;chosen.forEach(r=>{const e=r.effects||{},s=r.synergy||{};if(typeof e.skillDamageBoost==='number'){dps*=1+e.skillDamageBoost/1000;hit++}if(typeof e.rangedHeavyAttackChance==='number'){dps*=1+e.rangedHeavyAttackChance/2000;hit++}if(typeof e.magicHitChance==='number'){dps*=1+e.magicHitChance/4000;hit++}if(typeof e.skillDamageResistance==='number'){b.survive*=1+e.skillDamageResistance/4000;hit++}if(typeof e.meleeEvasion==='number'){b.survive*=1+e.meleeEvasion/5000;hit++}if(typeof e.manaCostEfficiency==='number'){support*=1+e.manaCostEfficiency/1000;hit++}if(typeof s.attackSpeed==='number'){attack*=1+s.attackSpeed/100;hit++}if(typeof s.dexterity==='number'){b.dps+=s.dexterity;hit++}if(typeof s.perception==='number'){b.dps+=s.perception;hit++}});b.dps*=dps*attack;b.support*=support;b.score=w.goal==='burst'?b.burst:w.goal==='dps'?b.dps:w.goal==='survive'?b.survive:w.goal==='support'?b.support:(b.burst+b.dps+b.survive+b.support)/4;w.active=b;w.renderAll(b);info.innerHTML='<span class="badge">'+hit+' verifizierte Rune-Effekte angewendet</span>'+(hit?'':' Keine verifizierten numerischen Effekte ausgewählt.');render()};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};load()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
