<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v20</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v19.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#stats'))return setTimeout(boot,100);if(d.getElementById('realStatsV20'))return;const sec=d.createElement('section');sec.id='realStatsV20';sec.className='card';sec.innerHTML='<h3>Reale kombinierte Charakterwerte</h3><p class="muted">Alle verfügbaren numerischen Werte aus angelegten Waffen, Rüstung, Schmuck, Traits, Runen und verifizierten Regeln werden zusammengeführt. Nicht vorhandene Werte werden nicht geschätzt.</p><div id="primaryV20"></div><div id="combatV20" style="margin-top:9px"></div><div id="scoreExplainV20" class="muted" style="margin-top:9px"></div>';const anchor=d.getElementById('character')?.closest('.card')||d.getElementById('stats').closest('.card');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const p=sec.querySelector('#primaryV20'),c=sec.querySelector('#combatV20'),info=sec.querySelector('#scoreExplainV20');const names={strength:'Stärke',dexterity:'Geschicklichkeit',wisdom:'Weisheit',perception:'Wahrnehmung',fortitude:'Zähigkeit',maxHealth:'Max. Gesundheit',maxMana:'Max. Mana',attackSpeed:'Angriffsgeschwindigkeit',cooldownSpeedPercent:'Cooldown Speed %',criticalHitChance:'Krit-Chance',heavyAttackChance:'Heavy-Attack-Chance',hitChance:'Trefferchance',skillDamageBoost:'Skill Damage Boost',skillDamageResistance:'Skill Damage Resistance',meleeEndurance:'Nahkampf-Endurance',rangedEndurance:'Fernkampf-Endurance',magicEndurance:'Magie-Endurance',meleeEvasion:'Nahkampf-Evasion',rangedEvasion:'Fernkampf-Evasion',magicEvasion:'Magie-Evasion',damageReduction:'Schadensreduktion'};function add(obj,k,v){if(typeof v!=='number'||!isFinite(v))return;obj[k]=(obj[k]||0)+v}function collect(){const b=w.active;if(!b)return{};const out={};Object.values(b.l||{}).filter(Boolean).forEach(x=>{const s=x.stats||{};Object.keys(s).forEach(k=>{if(typeof s[k]==='number')add(out,k,s[k])});const t=x.traits||[];t.forEach(z=>{if(typeof z==='object')Object.keys(z).forEach(k=>{if(typeof z[k]==='number')add(out,k,z[k])})})});const rules=w.rules||[];const weaponRules=rules.filter(r=>r.verified&&(r.weapon==='global'||b.c.includes(r.weapon)));weaponRules.forEach(r=>{if(typeof r.bossHeavyAttackChanceFlat==='number')add(out,'heavyAttackChance',r.bossHeavyAttackChanceFlat);if(typeof r.bossCriticalHitChanceFlat==='number')add(out,'criticalHitChance',r.bossCriticalHitChanceFlat)});return out}function milestones(s){if(s.strength>=120){add(s,'maxHealth',600);add(s,'damageReduction',18);add(s,'heavyAttackDamage',5)}else if(s.strength>=100){add(s,'maxHealth',600);add(s,'damageReduction',18)}if(s.dexterity>=120){add(s,'criticalHitChance',120);add(s,'attackSpeed',4);add(s,'criticalDamage',4)}else if(s.dexterity>=100){add(s,'criticalHitChance',60);add(s,'attackSpeed',4)}if(s.wisdom>=120){add(s,'maxMana',600);add(s,'manaCostEfficiency',3);add(s,'maxDamage',10)}else if(s.wisdom>=100){add(s,'maxMana',600);add(s,'manaCostEfficiency',3)}if(s.perception>=120){add(s,'hitChance',120);add(s,'range',5);add(s,'ccChance',100)}else if(s.perception>=100){add(s,'hitChance',60);add(s,'range',5)}if(s.fortitude>=120){add(s,'meleeEndurance',60);add(s,'criticalDamageResistance',4);add(s,'heavyAttackDamageResistance',5)}else if(s.fortitude>=100)add(s,'meleeEndurance',60)}function fmt(k,v){let unit=['attackSpeed','cooldownSpeedPercent','criticalHitChance','heavyAttackChance','hitChance','skillDamageBoost','skillDamageResistance','damageReduction','criticalDamage','manaCostEfficiency','maxDamage','range'].includes(k)?'':' ';return (Math.round(v*100)/100)+unit}function score(s){const offensive=(s.criticalHitChance||0)+(s.heavyAttackChance||0)+(s.hitChance||0)+(s.skillDamageBoost||0)*2+(s.attackSpeed||0)*10+(s.cooldownSpeedPercent||0)*10+(s.criticalDamage||0)*2+(s.maxDamage||0);const defensive=(s.maxHealth||0)/10+(s.meleeEndurance||0)+(s.rangedEndurance||0)+(s.magicEndurance||0)+(s.meleeEvasion||0)+(s.rangedEvasion||0)+(s.magicEvasion||0)+(s.damageReduction||0)*5;return Math.round((offensive+defensive)*100)/100}function render(){const s=collect();milestones(s);p.innerHTML='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px">'+['strength','dexterity','wisdom','perception','fortitude'].map(k=>'<div style="padding:10px;border:1px solid #29434d;border-radius:10px;text-align:center"><b style="font-size:20px">'+(s[k]||0).toFixed(0)+'</b><br><span class="small">'+names[k]+'</span></div>').join('')+'</div>';const keys=['maxHealth','maxMana','attackSpeed','cooldownSpeedPercent','criticalHitChance','heavyAttackChance','hitChance','skillDamageBoost','skillDamageResistance','meleeEndurance','rangedEndurance','magicEndurance','meleeEvasion','rangedEvasion','magicEvasion','damageReduction','criticalDamage','maxDamage'];c.innerHTML='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">'+keys.filter(k=>s[k]!==undefined).map(k=>'<div style="padding:9px;border:1px solid #29434d;border-radius:9px"><b>'+names[k]+'</b><br>'+fmt(k,s[k])+'</div>').join('')+'</div>';const sc=score(s);info.innerHTML='<span class="badge">BUILD SCORE '+sc.toFixed(0)+'</span> Dieser Score ist ein transparenter Vergleichswert aus den tatsächlich vorhandenen kombinierten Stats – kein behaupteter offizieller Ingame-Kampfkraftwert. Patch-4.0-Attribut-Meilensteine werden ab 100/120 angewendet.';d.querySelector('#recalc').insertAdjacentHTML('afterend','<div id="scoreSyncV20" class="muted" style="margin-top:8px">Realer Build-Score: <b>'+sc.toFixed(0)+'</b></div>')}const oldRecalc=w.recalc;w.recalc=function(){oldRecalc();render()};const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(render,0)};render()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
