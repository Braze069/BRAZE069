<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v21</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v20.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#realStatsV20'))return setTimeout(boot,100);if(d.getElementById('growthAuditV21'))return;const sec=d.createElement('section');sec.id='growthAuditV21';sec.className='card';sec.innerHTML='<h3>Nix-Systeme & Datenabdeckung</h3><p class="muted">Der Builder prüft zusätzlich Item-Level, Potential/Latent-Abilities, Weapon Mastery, Trait Resonance und Attribute. Es werden ausschließlich vorhandene verifizierte Daten verwendet.</p><div id="auditGridV21"></div><div id="auditDetailsV21" style="margin-top:9px"></div>';const anchor=d.getElementById('realStatsV20');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const grid=sec.querySelector('#auditGridV21'),details=sec.querySelector('#auditDetailsV21');const labels={itemLevel:'Item-Level',potential:'Potential / Latent Ability',mastery:'Weapon Mastery',resonance:'Trait Resonance',attributes:'Attribute-System'};function getItems(){const b=w.active;if(!b)return[];return Object.values(b.l||{}).filter(Boolean)}function scan(){const items=getItems();const rows={itemLevel:items.filter(x=>typeof x.itemLevel==='number'),potential:items.filter(x=>Array.isArray(x.potentialAbilities)||Array.isArray(x.potentials)||Array.isArray(x.latentAbilities)),mastery:[],resonance:items.filter(x=>x.traitResonance||x.resonance),attributes:items.filter(x=>x.stats&&Object.keys(x.stats).some(k=>['strength','dexterity','wisdom','perception','fortitude'].includes(k)))};grid.innerHTML='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">'+Object.keys(labels).map(k=>'<div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>'+labels[k]+'</b><br><span class="badge">'+(rows[k].length?rows[k].length+' erkannt':'NOCH KEINE VERIFIZIERTEN DATEN')+'</span></div>').join('')+'</div>';const pot=rows.potential.map(x=>'<div class="box" style="margin-top:6px"><b>'+x.name+'</b><br>'+JSON.stringify(x.potentialAbilities||x.potentials||x.latentAbilities)+'</div>').join('');details.innerHTML='<div class="warn">'+(rows.potential.length?'Potential/Latent-Abilities wurden in den ausgewählten Items gefunden und transparent angezeigt.':'Für die aktuell ausgewählten Items sind noch keine verifizierten Potential-/Latent-Ability-Datensätze in der lokalen Datenbank vorhanden. Dafür wird <b>kein erfundener Score</b> vergeben.')+'</div>'+(pot||'')}const oldRender=w.renderAll;w.renderAll=function(b){oldRender(b);setTimeout(scan,0)};const oldRecalc=w.recalc;w.recalc=function(){oldRecalc();scan()};scan()}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
