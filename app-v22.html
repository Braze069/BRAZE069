<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v22</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}.card{margin:12px;padding:15px;border:1px solid #29434d;border-radius:17px;background:#0d1e25;color:#f5f7f7;font:14px system-ui}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#173529;color:#79e3a0;font-size:9px;font-weight:900}.muted{font-size:11px;color:#9db1b7;line-height:1.45}</style></head><body><iframe id="appFrame" src="app-v20.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.querySelector('#stats'))return setTimeout(boot,100);if(d.getElementById('nixV22'))return;const sec=d.createElement('section');sec.id='nixV22';sec.className='card';sec.innerHTML='<h3>Nix – verifizierte Datenbasis</h3><p class="muted">Die Nix-Erweiterung ist jetzt als eigene Datenbasis hinterlegt. Item-spezifische Werte werden nur bewertet, wenn sie verifiziert vorliegen.</p><div id="nixGridV22"></div><div id="nixMasteryV22" style="margin-top:9px"></div><div class="muted" style="margin-top:9px">Quelle: offizielle Update-4.0.0-Dokumentation. </div>';const anchor=d.getElementById('realStatsV20')||d.getElementById('character');anchor.parentNode.insertBefore(sec,anchor.nextSibling);const grid=sec.querySelector('#nixGridV22'),mast=sec.querySelector('#nixMasteryV22');fetch('data/nix_systems_verified.json',{cache:'no-store'}).then(r=>r.json()).then(db=>{const s=db.verifiedSystems,m=db.masteries;grid.innerHTML='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">'+[['Level-Cap',s.maxCharacterLevel],['Stat-Cap',s.statCap],['Neue Waffe',s.newWeapon],['Gauntlets',s.gauntletUniqueCountMinimum+'+ verifizierte Einträge'],['Mastery gesamt',s.weaponMasteryOverallCap],['Mastery/Waffe',s.weaponMasteryPerWeaponCap],['Rüstungs-Runen',s.armorRunesAdded?'Ja':'Nein'],['Potential Skills',s.potentialSkills]].map(x=>'<div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')+'</div>';mast.innerHTML='<h4>Neue Overall Masteries</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>Bloodlust · Lv. '+m.bloodlust.level+'</b><br>'+m.bloodlust.manaCostPercent+'% Mana/s · bis '+m.bloodlust.maxStacks+' Stacks<br>'+m.bloodlust.bossHeavyAttackHitPerStack+' Boss Heavy Attack Hit + '+m.bloodlust.bossCriticalHitPerStack+' Boss Crit/Stack</div><div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>Piercing Spear · Lv. '+m.piercingSpear.level+'</b><br>'+m.piercingSpear.hitsRequired+' Treffer → '+m.piercingSpear.baseDamagePercent+'% Base Damage<br>'+m.piercingSpear.cooldownSeconds+'s Cooldown · ignoriert Block</div></div>';}).catch(()=>{grid.innerHTML='<span class="badge">Nix-Datenbank nicht geladen</span>'})}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
