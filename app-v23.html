<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v23</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}</style></head><body><iframe id="appFrame" src="app-v21.html" title="Braze Power Builder"></iframe><script>(function(){const f=document.getElementById('appFrame');function boot(){const d=f.contentDocument;if(!d||!d.querySelector('#realStatsV20'))return setTimeout(boot,100);if(d.getElementById('nixVerifiedV23'))return;const s=d.createElement('section');s.id='nixVerifiedV23';s.className='card';s.innerHTML='<h3>Nix – verifizierte Datenbasis</h3><p class="muted">Die App zeigt hier die offiziell bestätigten Nix-Systeme. Item-spezifische Werte werden nur verwendet, wenn sie separat verifiziert sind.</p><div id="nixGridV23"></div><div id="nixNoteV23" class="warn" style="margin-top:9px"></div>';const a=d.getElementById('realStatsV20');a.parentNode.insertBefore(s,a.nextSibling);const grid=s.querySelector('#nixGridV23'),note=s.querySelector('#nixNoteV23');fetch('data/nix_systems_verified.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{const v=x.verifiedSystems,m=x.statMilestones;grid.innerHTML='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">'+[['Max. Level',v.maxCharacterLevel],['Stat-Cap',v.statCap],['Weapon Mastery gesamt',v.weaponMasteryOverallCap],['Mastery je Waffe',v.weaponMasteryPerWeaponCap],['Neue Waffe',v.newWeapon],['Gauntlets',v.gauntletUniqueCountMinimum+"+ bestätigt"],['Rüstungs-Runen',v.armorRunesAdded?'✓':'—'],['Potential Skills',v.potentialSkills?'✓':'—'],['Trait Resonance',v.traitResonance?'✓':'—'],['Seal-System',v.sealSystem?'✓':'—']].map(q=>'<div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>'+q[0]+'</b><br>'+q[1]+'</div>').join('')+'</div><h4>Attribut-Meilensteine</h4><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px">'+Object.entries(m).map(([k,v])=>'<div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>'+k+'</b><br>100: '+JSON.stringify(v['100'])+'<br>120: '+JSON.stringify(v['120'])+'</div>').join('')+'</div><h4>Weapon Mastery</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>Bloodlust</b><br>Lv. 1560 · 4% Mana/s · bis 3 Stacks</div><div style="padding:10px;border:1px solid #29434d;border-radius:10px"><b>Piercing Spear</b><br>Lv. 1560 · 10 Treffer · 600% Basisschaden</div></div>';note.innerHTML='<b>Transparente Datenpolitik:</b> Die offiziellen Patchdaten bestätigen die Systeme und Grenzwerte. Für einzelne Nix-Items werden nur bereits verifizierte konkrete Werte in den Score übernommen. Fehlende Itemwerte bleiben neutral.'}).catch(e=>note.textContent='Nix-Daten konnten nicht geladen werden: '+e.message)}if(f.contentDocument&&f.contentDocument.readyState==='complete')boot();else f.addEventListener('load',boot);})();</script></body></html>
