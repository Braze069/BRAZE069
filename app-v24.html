<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v24</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}#nixCatalog{position:fixed;right:12px;bottom:12px;z-index:20;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:12px;padding:10px;max-width:320px;font:12px system-ui;box-shadow:0 8px 30px #0008}.nixhead{font-weight:900}.nixcount{color:#79e3a0}.nixlist{max-height:220px;overflow:auto;margin-top:7px}.nixitem{padding:6px 0;border-top:1px solid #29434d}.ok{color:#79e3a0}.candidate{color:#e1bf67}</style></head><body><iframe id="appFrame" src="app-v23.html" title="Braze Power Builder"></iframe><div id="nixCatalog"><div class="nixhead">Nix-Itemdatenbank <span id="nixCount" class="nixcount">lädt…</span></div><div class="nixlist" id="nixList"></div></div><script>(async()=>{try{const x=await fetch('data/nix_items_verified.json',{cache:'no-store'}).then(r=>r.json());const ok=x.items.filter(i=>i.verifiedStats).length;document.getElementById('nixCount').textContent=ok+'/'+x.items.length+' mit verifizierten Werten';document.getElementById('nixList').innerHTML=x.items.map(i=>'<div class="nixitem"><b>'+i.name+'</b><br><span class="'+(i.verifiedStats?'ok':'candidate')+'">'+(i.verifiedStats?'✓ verifiziert':'◐ Kandidat – neutral im Score')+'</span>'+(i.itemLevel?' · IL '+i.itemLevel:'')+'</div>').join('')}catch(e){document.getElementById('nixList').textContent='Datenbank konnte nicht geladen werden.'}})()</script></body></html>
