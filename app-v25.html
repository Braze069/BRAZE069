<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v25</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}.bar{position:fixed;right:10px;bottom:10px;z-index:30;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:340px;font:12px system-ui;box-shadow:0 8px 30px #0008}.ok{color:#79e3a0}.warn{color:#e1bf67}.list{max-height:180px;overflow:auto;margin-top:6px}.it{padding:6px 0;border-top:1px solid #29434d}</style></head><body><iframe id="appFrame" src="app-v24.html" title="Braze Power Builder"></iframe><div class="bar"><b>v25 · Nix-Itemdatenbank im Optimizer</b><div id="status" class="ok">Daten werden geprüft …</div><div id="list" class="list"></div></div><script>(async()=>{try{const x=await fetch('data/nix_items_verified.json',{cache:'no-store'}).then(r=>r.json());const verified=x.items.filter(i=>i.verifiedStats);document.getElementById('status').textContent=verified.length+' individuell verifizierte Items · nur diese fließen in den Optimizer';document.getElementById('list').innerHTML=verified.map(i=>'<div class="it"><b>'+i.name+'</b><br><span class="ok">✓ verifiziert</span>'+(i.itemLevel?' · IL '+i.itemLevel:'')+'</div>').join('')}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
