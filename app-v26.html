<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v26</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{display:block;width:100%;height:100vh;border:0;background:#061015}.bar{position:fixed;right:10px;bottom:10px;z-index:30;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:360px;font:12px system-ui;box-shadow:0 8px 30px #0008}.ok{color:#79e3a0}.warn{color:#e1bf67}.list{max-height:210px;overflow:auto;margin-top:6px}.it{padding:6px 0;border-top:1px solid #29434d}.title{font-weight:900;margin-bottom:4px}</style></head><body><iframe id="appFrame" src="app-v25.html" title="Braze Power Builder"></iframe><div class="bar"><div class="title">v26 · Datenbank-Abdeckung 4.3.0</div><div id="status" class="ok">Prüfe Katalog …</div><div id="queue" class="list"></div></div><script>(async()=>{try{const x=await fetch('data/catalog_coverage_4_3_0.json',{cache:'no-store'}).then(r=>r.json());const q=x.nextVerificationQueue;document.getElementById('status').textContent='Katalog erweitert · '+x.weaponCatalogCandidates.length+' Waffen + '+x.armorCatalogCandidates.length+' Rüstungskandidaten';document.getElementById('queue').innerHTML='<div class="warn"><b>Nächste Einzelverifikation</b></div>'+q.map(n=>'<div class="it">'+n+'<br><span class="warn">◐ Kandidat · noch nicht im Score</span></div>').join('')}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Katalogfehler: '+e.message}})()</script></body></html>
