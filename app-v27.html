<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v27</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{width:100%;height:100vh;border:0}.bar{position:fixed;right:10px;bottom:10px;z-index:30;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:350px;font:12px system-ui}.ok{color:#79e3a0}.list{max-height:160px;overflow:auto;margin-top:6px}.it{padding:5px 0;border-top:1px solid #29434d}</style></head><body><iframe id="appFrame" src="app-v24.html" title="Braze Power Builder"></iframe><div class="bar"><b>v27 · verifizierte Item-Daten</b><div id="status" class="ok">Prüfe Datenbank …</div><div id="list" class="list"></div></div><script>(async()=>{try{const x=await fetch('data/items.json?cache='+Date.now()).then(r=>r.json());const v=x.items.filter(i=>i.verified);document.getElementById('status').textContent=v.length+' verifizierte Items im Optimizer';document.getElementById('list').innerHTML=v.map(i=>'<div class="it"><b>'+i.name+'</b><br><span class="ok">✓ '+(i.weaponType||i.slot||i.type)+'</span></div>').join('')}catch(e){document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
