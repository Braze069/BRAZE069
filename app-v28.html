<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v28</title><style>html,body{margin:0;background:#061015;height:100%}#appFrame{width:100%;height:100vh;border:0}.bar{position:fixed;right:10px;bottom:10px;z-index:30;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:370px;font:12px system-ui;box-shadow:0 8px 30px #0008}.ok{color:#79e3a0}.warn{color:#e1bf67}.list{max-height:220px;overflow:auto;margin-top:6px}.it{padding:6px 0;border-top:1px solid #29434d}.title{font-weight:900;margin-bottom:5px}</style></head><body><iframe id="appFrame" src="app-v24.html" title="Braze Power Builder"></iframe><div class="bar"><div class="title">v28 · Verifikation & 4.3.0</div><div id="status" class="ok">Daten werden geprüft …</div><div id="rules" class="list"></div><div id="items" class="list"></div></div><script>(async()=>{try{const [x,r]=await Promise.all([fetch('data/items.json?x='+Date.now()).then(a=>a.json()),fetch('data/combat_rules_4_3_0.json?x='+Date.now()).then(a=>a.json())]);const v=x.items.filter(i=>i.verified);document.getElementById('status').textContent=v.length+' verifizierte Items · '+r.rules.filter(q=>q.verified).length+' verifizierte 4.3.0-Regeln aktiv';document.getElementById('rules').innerHTML='<b class="warn">Aktive Patch-Regeln</b>'+r.rules.filter(q=>q.verified).map(q=>'<div class="it">✓ '+q.id+'</div>').join('');document.getElementById('items').innerHTML='<b class="ok">Items im Score</b>'+v.map(i=>'<div class="it"><b>'+i.name+'</b><br><span class="ok">✓ verifiziert</span>'+(i.itemLevel?' · IL '+i.itemLevel:'')+'</div>').join('')}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
