<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v30</title><style>html,body{margin:0;background:#061015;height:100%}#app{width:100%;height:100vh;border:0}.panel{position:fixed;right:10px;bottom:10px;z-index:20;background:#10242b;color:#fff;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:380px;font:12px system-ui;box-shadow:0 8px 30px #0008}.ok{color:#79e3a0}.warn{color:#e1bf67}.item{padding:7px 0;border-top:1px solid #29434d}</style></head><body><iframe id="app" src="app-v28.html" title="Braze Power Builder"></iframe><div class="panel"><b>v30 · Zubehör-Verifikation</b><div id="status" class="ok">Prüfe Datenbank …</div><div id="list"></div></div><script>(async()=>{try{const d=await fetch('data/accessories_verified.json?x='+Date.now()).then(r=>r.json());document.getElementById('status').textContent=d.items.length+' Zubehörteil(e) verifiziert und für den Score freigegeben';document.getElementById('list').innerHTML=d.items.map(i=>'<div class="item">✓ <b>'+i.name+'</b><br>'+Object.entries(i.stats).map(([k,v])=>k+': '+v).join(' · ')+'</div>').join('')}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
