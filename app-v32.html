<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09141a"><title>Throne and Liberty – Braze Power Builder v32</title><style>html,body{margin:0;background:#061015;height:100%}#app{width:100%;height:100vh;border:0}</style></head><body><iframe id="app" src="app-v30.html" title="Braze Power Builder"></iframe><script>(async()=>{const f=document.getElementById('app');const map=await fetch('data/de_names.json?x='+Date.now()).then(r=>r.json());function replace(){try{const w=f.contentWindow,d=w.document,walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){let s=n.nodeValue;for(const [en,de] of Object.entries(map))if(s.includes(en))s=s.split(en).join(de);if(s!==n.nodeValue)n.nodeValue=s}}catch(e){}}f.addEventListener('load',()=>{replace();setTimeout(replace,300);setTimeout(replace,1000);setTimeout(replace,2500);});})();</script></body></html>
