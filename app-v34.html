<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061015"><title>THRONE AND LIBERTY – BRAZE POWER BUILDER v34</title><style>html,body{margin:0;background:#061015;height:100%;font-family:system-ui,sans-serif;color:#fff}#app{width:100%;height:100vh;border:0}.panel{position:fixed;right:10px;bottom:10px;z-index:20;background:#10242b;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:420px;max-height:55vh;overflow:auto;box-shadow:0 8px 30px #0008;font-size:12px}.ok{color:#79e3a0}.warn{color:#e1bf67}.item{padding:8px 0;border-top:1px solid #29434d}.badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#19343d;margin-right:5px}</style></head><body><iframe id="app" src="app-v30.html" title="THRONE AND LIBERTY – BRAZE POWER BUILDER"></iframe><div class="panel"><b>v34 · Wo bekomme ich den Gegenstand?</b><div id="status" class="ok">Lade Erwerbsquellen …</div><div id="list"></div></div><script>(async()=>{try{const d=await fetch('data/acquisition.json?x='+Date.now()).then(r=>r.json());document.getElementById('status').textContent=d.items.length+' Gegenstände mit Erwerbsinformationen hinterlegt';document.getElementById('list').innerHTML=d.items.map(i=>'<div class="item"><b>'+i.name+'</b><br>'+i.sources.map(s=>'<span class="badge">'+s.type+'</span>'+s.detail).join('<br>')+'<br><small style="opacity:.7">Status: '+i.status.replaceAll('_',' ')+'</small></div>').join('')}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
