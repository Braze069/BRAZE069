<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061015"><title>THRONE AND LIBERTY – BRAZE POWER BUILDER v35</title><style>html,body{margin:0;background:#061015;height:100%;font-family:system-ui,sans-serif;color:#fff}#app{width:100%;height:100vh;border:0}.panel{position:fixed;right:10px;bottom:10px;z-index:20;background:#10242b;border:1px solid #29434d;border-radius:14px;padding:12px;max-width:440px;max-height:60vh;overflow:auto;box-shadow:0 8px 30px #0008;font-size:12px}.ok{color:#79e3a0}.warn{color:#e1bf67}.item{padding:9px 0;border-top:1px solid #29434d}.badge{display:inline-block;padding:2px 6px;border-radius:6px;background:#19343d;margin:3px 4px 3px 0}.muted{opacity:.65}a{color:#9edcff}</style></head><body><iframe id="app" src="app-v30.html" title="THRONE AND LIBERTY – BRAZE POWER BUILDER"></iframe><div class="panel"><b>v35 · Erwerbsquellen für alle Gegenstände</b><div id="status" class="ok">Lade Quellen…</div><div id="list"></div></div><script>(async()=>{try{const d=await fetch('data/acquisition_v35.json?x='+Date.now()).then(r=>r.json());document.getElementById('status').textContent='Quellenmodul aktiv · nur verifizierte Quellen werden als sicher gewertet';document.getElementById('list').innerHTML=d.knownVerified.map(i=>'<div class="item"><b>'+i.name+'</b><br>'+((i.sources||[]).map(s=>'<span class="badge">'+s.type+'</span>'+s.detail+' <span class="muted">['+s.status+']</span>').join('<br>'))+(i.link?'<br><a href="'+i.link+'" target="_blank" rel="noopener">Quelle öffnen</a>':'')+'<br><small class="muted">Weitere Erwerbswege: noch nicht verifiziert – werden nicht erfunden.</small></div>').join('')+'<div class="item"><b>Für alle weiteren Items</b><br><span class="muted">Das gleiche Quellenfeld wird verwendet: Boss-Drop · Dungeon/Raid · Truhe · Auswahltruhe · Belohnung · Herstellung · Auktionshaus · Event/Vertrag. Bis zur Prüfung steht der Status auf „noch nicht verifiziert“.</span></div>'}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
