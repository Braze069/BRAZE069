<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061015"><title>THRONE AND LIBERTY – BRAZE POWER BUILDER v37</title><style>html,body{margin:0;background:#061015;height:100%;font-family:system-ui,sans-serif;color:#fff}#app{width:100%;height:100vh;border:0}.panel{position:fixed;right:10px;bottom:10px;z-index:20;background:#10242b;border:1px solid #29434d;border-radius:14px;padding:13px;max-width:440px;max-height:65vh;overflow:auto;box-shadow:0 8px 30px #0008;font-size:12px}.ok{color:#79e3a0}.warn{color:#e1bf67}.row{padding:7px 0;border-top:1px solid #29434d}.badge{display:inline-block;padding:2px 7px;border-radius:7px;background:#19343d;margin:3px 4px 3px 0}.muted{opacity:.65}</style></head><body><iframe id="app" src="app-v35.html" title="THRONE AND LIBERTY – BRAZE POWER BUILDER"></iframe><div class="panel"><b>v37 · Vollständige Erwerbsinformationen</b><div id="status" class="ok">Prüfe Quellenmodul …</div><div id="list"></div></div><script>(async()=>{try{const d=await fetch('data/acquisition_schema_v37.json?x='+Date.now()).then(r=>r.json());document.getElementById('status').textContent='Erwerbssystem aktiv · '+d.appliesTo.length+' Kategorien';document.getElementById('list').innerHTML='<div class="row"><b>Erfasst werden:</b><br>'+d.acquisitionTypes.map(x=>'<span class="badge">'+x+'</span>').join('')+'</div><div class="row"><b>Für jeden Gegenstand:</b><br>'+d.fields.join(' · ')+'</div><div class="row"><b>Verifikationsregel</b><br><span class="muted">'+d.verificationRule+'</span></div><div class="row"><b>Wichtig</b><br><span class="muted">Trait-Extrakte, vollständige Gegenstände, Herstellung und Handel werden getrennt geprüft. Keine erfundenen Dropquellen oder Dropchancen.</span></div>'}catch(e){document.getElementById('status').className='warn';document.getElementById('status').textContent='Datenbankfehler: '+e.message}})()</script></body></html>
