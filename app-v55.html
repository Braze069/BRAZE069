<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAZE POWER BUILDER v55</title><style>body{margin:0;background:#061015;color:#f5f7f7;font:14px system-ui}.app{max-width:1000px;margin:auto;padding:14px}.card{background:#0d1e25;border:1px solid #29434d;border-radius:16px;padding:15px;margin-bottom:12px}.btn{padding:10px 14px;border:1px solid #35525c;border-radius:10px;background:#09161b;color:#fff;font-weight:800;cursor:pointer;margin:3px}.active{background:#e1bf67;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{padding:10px;border:1px solid #29434d;border-radius:10px}.slot select,input{width:100%;box-sizing:border-box;margin-top:6px;padding:10px;border-radius:9px;background:#09161b;color:#fff;border:1px solid #35525c}.score{font-size:46px;color:#79e3a0;font-weight:1000}.muted{color:#9db1b7;font-size:12px}.source{padding:10px;border-bottom:1px solid #29434d}.ok{padding:10px;border-left:3px solid #79e3a0;background:#0e2118;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="card"><h1>THRONE AND LIBERTY – BRAZE POWER BUILDER</h1><div class="muted">v55 · 4.3.0 · deutsche Oberfläche · verifizierter Optimizer</div></div><div class="card"><b>Modus:</b><button class="btn active" data-mode="PvP">PvP</button><button class="btn" data-mode="PvE">PvE</button><br><b>Ziel:</b><button class="btn active" data-goal="Gesamt">Gesamt</button><button class="btn" data-goal="Burst">Burst</button><button class="btn" data-goal="DPS">DPS</button><button class="btn" data-goal="Überleben">Überleben</button><button class="btn" data-goal="Support">Support</button><br><button class="btn" id="best">⭐ Besten Build berechnen</button><span id="status" class="muted"></span></div><div class="card"><h2>Berechneter Charakter</h2><div id="summary"></div></div><div class="card"><h2>Charakter-Editor</h2><div id="editor" class="grid"></div><button class="btn" id="recalc">⭐ Charakter-Score neu berechnen</button><div id="result"></div></div><div class="card"><h2>Score-Aufschlüsselung</h2><div id="breakdown"></div></div><div class="card"><h2>Andere Waffen-Builds</h2><div id="builds"></div></div><div class="card"><h2>Gegenstand & Erwerb</h2><input id="search" placeholder="Gegenstand suchen …"><div id="items"></div></div><div class="card"><h2>Fähigkeitskerne · Rezepte · Amitoi</h2><button class="btn active" data-tab="cores">Fähigkeitskerne</button><button class="btn" data-tab="recipes">Rezepte</button><button class="btn" data-tab="amitoi">Amitoi</button><div id="tab"></div></div></main><script>(async()=>{let db=[],acq={},cores=[],recipes=[],amitoi=[],mode='PvP',goal='Gesamt',chosen={};const $=i=>document.getElementById(i),de={'item_titanspine_longbow':'Langbogen des Titanendorns','item_arc_lunar_radiance':'Bogen des Mondglanzes','item_bercants_steelstring_bow':'Bercants Stahlsaitenbogen','item_deluzhnoa_arc_frozen_death':'Deluzhnoas Bogen des gefrorenen Todes','item_eternal_promise':'Ewiges Versprechen','item_noble_birthright_brooch':'Brosche des edlen Erbes','item_oblivions_wrath_barbute':'Barbute des Zorns der Vergessenheit','item_oblivions_wrath_chest_plate':'Brustplatte des Zorns der Vergessenheit','item_oblivions_wrath_gauntlets':'Stulpen des Zorns der Vergessenheit','item_oblivions_wrath_leggings':'Beinschienen des Zorns der Vergessenheit','item_oblivions_wrath_stompers':'Stampfer des Zorns der Vergessenheit','item_kingslayer_banded_platemail':'Gebänderte Plattenrüstung des Königsmörders','item_frost_lord_black_scale_gloves':'Schwarze Schuppenhandschuhe des Frostfürsten','item_frost_lord_black_scale_boots':'Schwarze Schuppenstiefel des Frostfürsten','item_hex_ingenuity_greaves':'Beinschienen der Hexenlist','item_chaos_witch_comet_fists':'Faustwaffen des Kometen der Chaoshexe'};let nm=x=>de[x.id]||x.name,n=v=>typeof v==='number'?v:0;function iv(x){let s=x.stats||{};return n(s.mainWeaponDamageMax)*.35+n(s.mainWeaponDamageMin)*.15+n(s.dexterity)*4+n(s.strength)*3+n(s.perception)*3+n(s.wisdom)*3+n(s.criticalHitChance)*.08+n(s.heavyAttackChance)*.08+n(s.hitChance)*.08+n(s.cooldownSpeedPercent)*2+n(s.attackSpeed)*12+n(s.attackSpeedPercent)*2+n(s.maxHealth)*.01+n(s.damageReduction)*.08+n(s.pvpHitChance)*5+(x.traits||[]).length*1.5}function pool(t,s){return db.filter(x=>x.verified&&x.type===t&&(!s||x.slot===s)).sort((a,b)=>iv(b)-iv(a))}function build(){let w=pool('weapon').filter((x,i,a)=>a.findIndex(y=>y.weaponType===x.weaponType)===i).slice(0,2),a=['helmet','chest','gloves','pants','boots'].map(s=>pool('armor',s)[0]).filter(Boolean),c=['necklace','bracelet','brooch','ring'].map(s=>pool('accessory',s)[0]).filter(Boolean);return{w,a,c}}function selectedBuild(){let b=build();Object.entries(chosen).forEach(([k,id])=>{let x=db.find(i=>i.id===id);if(!x)return;if(k==='w1')b.w[0]=x;if(k==='w2')b.w[1]=x;let ai=['helmet','chest','gloves','pants','boots'].indexOf(k);if(ai>=0)b.a[ai]=x;let ci=['necklace','bracelet','brooch','ring'].indexOf(k);if(ci>=0)b.c[ci]=x});return b}function calc(b){let raw=[...b.w,...b.a,...b.c].filter(Boolean).reduce((s,x)=>s+iv(x),0),f=mode==='PvE'?1.04:1;if(goal==='Burst')f*=1.08;if(goal==='DPS')f*=1.06;if(goal==='Überleben')f*=.98;if(goal==='Support')f*=.96;return{raw:+raw.toFixed(1),total:+(raw*f).toFixed(1),parts:[...b.w,...b.a,...b.c].filter(Boolean)}}function render(){let r=calc(selectedBuild());$('summary').innerHTML='<div class="score">'+r.total+'</div><h3>'+r.parts.filter(x=>x.type==='weapon').map(nm).join(' + ')+'</h3><div class="ok">'+mode+' · '+goal+' · '+r.parts.length+' verifizierte Teile bewertet.</div>';let c={Waffen:r.parts.filter(x=>x.type==='weapon'),Rüstung:r.parts.filter(x=>x.type==='armor'),Accessoires:r.parts.filter(x=>x.type==='accessory')};$('breakdown').innerHTML=Object.entries(c).map(([k,v])=>'<div class="source"><b>'+k+': '+v.reduce((s,x)=>s+iv(x),0).toFixed(1)+'</b><br>'+v.map(nm).join(' · ')+'</div>').join('')+'<div class="ok">Rohwert '+r.raw+' → Score '+r.total+'</div>'}function edit(){let b=build(),rows=[['w1','Waffe 1',pool('weapon'),b.w[0]],['w2','Waffe 2',pool('weapon'),b.w[1]],...['helmet','chest','gloves','pants','boots'].map(s=>[s,s, pool('armor',s),b.a.find(x=>x.slot===s)]),...['necklace','bracelet','brooch','ring'].map(s=>[s,s,pool('accessory',s),b.c.find(x=>x.slot===s)])];$('editor').innerHTML=rows.map(r=>'<div class="slot"><b>'+r[1]+'</b><select data-s="'+r[0]+'"><option value="">— bestes verifiziertes Teil —</option>'+r[2].map(x=>'<option value="'+x.id+'">'+nm(x)+'</option>').join('')+'</select></div>').join('');document.querySelectorAll('[data-s]').forEach(s=>s.onchange=()=>{chosen[s.dataset.s]=s.value;$('result').innerHTML='<div class="ok">✓ Auswahl gespeichert.</div>'})}function list(q=''){let a=db.filter(x=>(nm(x)+' '+x.name).toLowerCase().includes(q.toLowerCase()));$('items').innerHTML=a.map(x=>{let z=acq.items?.[x.id],src=(z?.sources||[]).map(s=>'<div>📍 '+s.type+': '+s.detail+'</div>').join('');return '<div class="source"><b>'+nm(x)+'</b><br>'+Object.entries(x.stats||{}).map(([k,v])=>k+': '+v).join(' · ')+'<br>Traits: '+((x.traits||[]).join(', ')||'keine')+(src?'<br><b>Erwerb:</b>'+src:'')+'</div>'}).join('')||'Keine Treffer.'}function tabs(t){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));if(t==='cores')$('tab').innerHTML=cores.map(c=>'<div class="source"><b>'+c.name+'</b> · '+c.weapon+'<br>'+c.effect+'</div>').join('')+'<div class="ok">4.3.0: bestimmte frühere Fähigkeitskerne wurden in Ausrüstungsoptionen integriert.</div>';if(t==='recipes')$('tab').innerHTML=recipes.map(r=>'<div class="source"><b>'+r.name+'</b><br>'+r.note+'</div>').join('');if(t==='amitoi')$('tab').innerHTML=amitoi.map(a=>'<div class="source"><b>'+a.name+'</b> · '+a.type+'<br>📍 '+a.acquisition+'</div>').join('')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{goal=b.dataset.goal;document.querySelectorAll('[data-goal]').forEach(x=>x.classList.toggle('active',x===b));render()});$('best').onclick=()=>{render();$('status').textContent=' ✓ neu berechnet'};$('recalc').onclick=()=>{let r=calc(selectedBuild());$('result').innerHTML='<div class="ok"><b>Neuer Charakter-Score: '+r.total+'</b></div>';render()};$('search').oninput=e=>list(e.target.value);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tabs(b.dataset.tab));let r=await Promise.all([fetch('data/items.json?55').then(x=>x.json()),fetch('data/acquisition_de.json?55').then(x=>x.json()),fetch('data/skill_cores_4_3_0.json?55').then(x=>x.json()),fetch('data/recipe_catalog_4_3_0.json?55').then(x=>x.json()),fetch('data/amitoi_sources_4_3_0.json?55').then(x=>x.json())]);db=r[0].items||[];acq=r[1];cores=r[2].weaponCores||[];recipes=r[3].recipes||[];amitoi=r[4].amitoi||[];render();edit();list();tabs('cores')})()</script></main></body></html>
