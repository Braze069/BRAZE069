t||""))),armor:usable.filter(x=>/armor|helmet|chest|gloves|boots|trousers/i.test((x.type||x.category||"")+" "+(x.slot||""))),accessory:usable.filter(x=>/accessory|ring|necklace|bracelet|belt/i.test((x.type||x.category||"")+" "+(x.slot||"")))};const score=x=>{const s=x.stats||{};return Object.values(s).reduce((a,v)=>a+(typeof v==="number"?v:0),0)};const best=k=>groups[k].slice().sort((a,b)=>score(b)-score(a))[0];const w=best("weapon"),a=best("armor"),q=best("accessory");out.innerHTML='<b>Beste verfügbare Kandidaten:</b><br>Waffe: '+(w?.name||"keine verifizierte Waffe")+'<br>Rüstung: '+(a?.name||"keine verifizierte Rüstung")+'<br>Accessoire: '+(q?.name||"kein verifiziertes Accessoire")+'<br><small style="color:#9db1b7">Modus: '+document.getElementById("autoMode").value+' · Ziel: '+document.getElementById("autoTarget").value+' · Grundlage: nur vorhandene verifizierte Daten.</small>'}catch(e){out.textContent="Die vorhandenen Daten konnten nicht automatisch bewertet werden."}finally{run.disabled=false}}})()<\/script></body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<main style="font-family:system-ui;padding:20px"><h2>Die App konnte nicht geladen werden.</h2><p>Bitte die Seite neu laden.</p></main>'}})()</script></body></html>
