<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THRONE AND LIBERTY – BRAZE POWER BUILDER v61</title><style>body{margin:0;background:#071218;color:#f4f7f8;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:18px}.card{background:#0d1e25;border:1px solid #29434d;border-radius:16px;padding:16px;margin:12px 0}button,select,input{font:inherit;padding:10px;border-radius:9px;border:1px solid #45606a;background:#10242c;color:#fff}button{cursor:pointer}.grid{display:grid;gap:10px}.muted{color:#9db1b7}.row{display:flex;gap:8px;flex-wrap:wrap}.score{font-size:30px;font-weight:800}.item{padding:10px;border:1px solid #29434d;border-radius:10px;margin-top:8px}</style></head><body><main><div class="card"><h1>THRONE AND LIBERTY – BRAZE POWER BUILDER</h1><p class="muted">v61 · stabile Testversion</p></div><div class="card grid"><h2>Build-Optimierung</h2><div class="row"><select id="mode"><option value="pve">PvE</option><option value="pvp">PvP</option></select><select id="target"><option value="gesamt">Gesamt</option><option value="burst">Burst</option><option value="dps">DPS</option><option value="survival">Überleben</option><option value="support">Support</option></select><button id="run">Besten verfügbaren Build berechnen</button></div><div id="status" class="muted">Bereit.</div></div><div class="card"><h2>Ergebnis</h2><div id="result">Noch keine Berechnung.</div></div><div class="card"><h2>Gegenstand suchen</h2><input id="search" placeholder="z. B. Langbogen, Brust, Ring …" style="width:100%;box-sizing:border-box"><div id="items"></div></div><div class="card"><h2>Einzelnen Gegenstand prüfen</h2><div id="detail" class="muted">Wähle oben einen Gegenstand.</div></div></main><script>(async()=>{const $=id=>document.getElementById(id);let data=[];const status=t=>$("status").textContent=t;function esc(s){return String(s??"").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function numStats(x){const s=x?.stats||{};return Object.entries(s).filter(([,v])=>typeof v==='number').reduce((a,[,v])=>a+v,0)}function render(){const q=$("search").value.trim().toLowerCase();const arr=data.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q)).slice(0,40);$("items").innerHTML=arr.length?arr.map((x,i)=>`<div class="item"><b>${esc(x.name||x.germanName||'Unbenannt')}</b><br><span class="muted">${esc(x.type||x.category||x.slot||'Gegenstand')}</span> <button data-i="${i}">Details</button></div>`).join(''):'<p class="muted">Kein Treffer.</p>';$("items").querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=arr[Number(b.dataset.i)];$("detail").innerHTML=`<b>${esc(x.name||x.germanName)}</b><br>Score-Beitrag: ${numStats(x).toFixed(2)}<br><pre style="white-space:pre-wrap">${esc(JSON.stringify(x,null,2))}</pre>`})}async function load(){status('Daten werden geladen …');const r=await fetch('data/items.json?v61',{cache:'no-store'});if(!r.ok)throw new Error('items.json '+r.status);const d=await r.json();data=Array.isArray(d)?d:(d.items||[]);render();status(data.length+' Gegenstände geladen.')}$("search").oninput=render;$("run").onclick=()=>{if(!data.length){status('Keine Daten geladen.');return}const sorted=[...data].filter(x=>x&&x.verified!==false).sort((a,b)=>numStats(b)-numStats(a));const best=sorted.slice(0,10);$("result").innerHTML=`<div class="score">${best.length?numStats(best[0]).toFixed(2):'—'}</div><p>Modus: <b>${$("mode").value}</b> · Ziel: <b>${$("target").value}</b></p>`+best.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.name||x.germanName||'Unbenannt')}</b><br>Bewertbare Werte: ${numStats(x).toFixed(2)}</div>`).join('');};try{await load()}catch(e){status('Fehler beim Laden der Daten: '+e.message);$("result").innerHTML='<b>Die App konnte die Daten nicht laden.</b><br><span class="muted">Bitte später erneut versuchen.</span>'}})();</script></body></html>
